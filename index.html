 const st={new:"Siparişiniz alındı",preparing:"Siparişiniz hazırlanıyor",done:D.s.self?"Siparişiniz hazır! İsminiz çağrılıyor":"Siparişiniz masanıza getiriliyor",cancelled:"Siparişiniz iptal edildi"}[o.st]||"";
 const left=60-(Date.now()-o.t)/1000,can=o.st=="new"&&left>0;
 return `<div class="card" style="border-color:var(--gold)"><div class="muted">Sipariş #${esc(o.no)}${who(o)?" · "+who(o):""}</div><div class="big">${st}</div>${lineList(o).map(l=>`<div class="row" style="padding:2px 0"><span>${l.q} × ${esc(l.n)}${l.o.length?`<br><small class="muted">${l.o.map(x=>esc(x)).join(", ")}</small>`:""}</span><span>${tl(l.q*l.p)}</span></div>`).join("")}<div class="row" style="border-top:1px solid var(--line)"><b>Toplam</b><b>${tl(ototal(o))}</b></div>${can?`<p class="muted">Yanlış sipariş mi? İptal veya değiştirme için <b id="cd">${Math.ceil(left)}</b> saniyen var.</p><div style="display:flex;gap:10px"><button class="btn bad" data-cancel>İptal et</button><button class="btn alt" data-edit>Değiştir</button></div>`:(o.st=="done"||o.st=="cancelled"?`<button class="btn alt" data-clear>Yeni sipariş ver</button>`:"")}</div>`}
function cartSheet(){
 const s=D.s;let rows=Object.entries(cart).map(([k,l])=>{const i=D.items.find(x=>x.id==l.id);return i?`<div class="row" style="align-items:center"><div style="flex:1"><div>${esc(i.n)}</div>${l.o.length?`<div class="muted" style="font-size:13px">${l.o.map(x=>esc(x.n)).join(", ")}</div>`:""}</div><div class="qty"><button data-m="${esc(k)}" aria-label="Azalt">−</button><b>${l.q}</b><button data-a="${esc(k)}" aria-label="Artır">+</button></div><b style="min-width:64px;text-align:right">${tl(l.q*unit(l))}</b></div>`:""}).join("");
 return `<div class="sheet" data-close><div><h2 style="font-size:30px">Siparişiniz</h2>${rows}<div class="row" style="border-top:1px solid var(--line);margin-top:6px"><span>Toplam</span><b class="big" style="font-size:26px">${tl(total())}</b></div>
 ${s.self?`${MASA?`<div class="card">Masanız: <b>${esc(MASA)}</b></div>`:""}<label for="nm">İsminiz (siparişiniz hazır olunca bu isimle çağrılır)</label><input id="nm" maxlength="30" value="${esc(nm)}" autocomplete="given-name">`:`<div class="card">Masanız: <b>${esc(MASA||"bilinmiyor")}</b></div>`}
 <label for="nt">Sipariş notu (istemediğiniz malzeme, alerji vb.)</label><textarea id="nt" rows="3" maxlength="300" placeholder="Örn: fıstıksız olsun">${esc(note)}</textarea>
 <div id="err" style="color:var(--bad);min-height:22px;margin-top:6px"></div>
 <div style="display:flex;gap:10px"><button class="btn alt" data-x>Geri dön</button><button class="btn" style="flex:1" data-send>Siparişi gönder</button></div></div></div>`}
async function send(){
 const s=D.s;nm=($("#nm")?.value||"").trim();note=$("#nt").value.trim();const er=m=>$("#err").textContent=m;
 if(s.self&&nm.length<2)return er("Lütfen isminizi girin; siparişiniz bu isimle çağrılacak.");
 if(!s.self&&!MASA)return er("Masa bilgisi yok. Lütfen masanızdaki QR kodu okutun.");
 const lines=Object.values(cart).filter(l=>{const i=D.items.find(x=>x.id==l.id);return i&&!i.sold}).map(l=>({id:l.id,q:l.q,o:l.o}));
 if(!lines.length)return er("Sepetiniz boş.");
 try{const r=await addDoc(collection(db,"orders"),{no:Math.floor(1000+Math.random()*9000),name:s.self?nm:"",table:MASA,k:MASA?KEY:"",note,lines,st:"new",t:serverTimestamp()});
  my=r.id;try{sessionStorage.setItem("my",JSON.stringify(my))}catch(e){}
  cart={};note="";sheet=null;watchOrders();draw();scrollTo({top:0,behavior:"smooth"})}catch(e){er("Sipariş gönderilemedi ("+(e.code||e.message)+"). Lütfen tekrar deneyin veya kasaya haber verin.")}}

function kasa(){
 if(!staff)return login("Kasa");
 const t0=dayStart().getTime(),td=D.orders.filter(o=>o.t>=t0&&o.st=="done"),ciro=td.reduce((a,o)=>a+(o.total??ototal(o)),0);
 const by=x=>D.orders.filter(o=>o.st==x),nw=by("new").reverse(),pr=by("preparing").reverse(),dn=by("done").slice(0,8);
 const btn=o=>o.st=="new"?`<button class="btn" data-act="${o.id}|preparing">Hazırlamaya başla</button>`:`<button class="btn" data-act="${o.id}|done">${D.s.self?"Hazır · ismi çağır":"Tamamla · masaya götür"}</button>`;
 const card=(o,a)=>`<div class="card"><div class="row"><b>#${esc(o.no)} · ${who(o)||"—"}</b><span class="muted">${new Date(o.t).toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"})}</span></div>${lineList(o).map(l=>`<div class="row" style="padding:2px 0"><span>${l.q} × ${esc(l.n)}${l.o.length?`<br><small class="muted">${l.o.map(x=>esc(x)).join(", ")}</small>`:""}</span><span>${tl(l.q*l.p)}</span></div>`).join("")}${o.note?`<div class="note">Not: ${esc(o.note)}</div>`:""}<div class="row"><b>${tl(o.total??ototal(o))}</b>${a?`<span style="display:flex;gap:6px"><button class="btn bad" data-act="${o.id}|cancelled">İptal</button>${o.st=="preparing"?`<button class="btn alt" data-rcp="${o.id}">🧾 Fiş</button>`:""}${btn(o)}</span>`:`<span style="display:flex;gap:6px;align-items:center"><button class="btn alt" data-rcp="${o.id}">🧾 Fişi yazdır</button><span class="badge">Tamamlandı</span></span>`}</div></div>`;
 return `<div class="wrap"><div class="stat"><h2 style="font-size:34px">Kasa</h2><span class="badge">${D.s.self?"Self servis modu":"Masa servisi modu"}</span><button class="btn alt" data-snd>${sndOn()?"🔔 Ses açık":"🔕 Ses kapalı"}</button><button class="btn alt" data-test>Sesi dene</button><button class="btn alt" style="margin-left:auto" data-out>Çıkış</button></div>
 <div class="card"><div class="muted">Bugünün cirosu</div><div class="big">${tl(ciro)}</div><div class="muted">${td.length} tamamlanan sipariş</div></div>
 <div class="grid c3"><div style="grid-column:span 2"><h3>Yeni siparişler (${nw.length})</h3>${nw.map(o=>card(o,1)).join("")||`<p class="muted">Yeni sipariş bekleniyor.</p>`}<h3>Hazırlanıyor (${pr.length})</h3>${pr.map(o=>card(o,1)).join("")||`<p class="muted">Hazırlanan sipariş yok.</p>`}</div><div><h3>Son tamamlananlar</h3>${dn.map(o=>card(o,0)).join("")||`<p class="muted">Henüz yok.</p>`}</div></div></div>`}
function yon(){
 if(!admin)return login("Yönetim");
 const s=D.s;
 let h=`<div class="wrap"><div class="stat"><h2 style="font-size:34px">Yönetim</h2><button class="btn alt" style="margin-left:auto" data-out>Çıkış</button></div>
 <div class="card"><h3>Site bilgileri</h3><label>Restoran adı</label><input data-s="title" value="${esc(s.title)}"><label>Açıklama</label><textarea rows="2" data-s="desc">${esc(s.desc)}</textarea><label>Wi-Fi şifresi</label><input data-s="wifi" value="${esc(s.wifi)}">
 <label>Çalışma modu</label><select data-s="self"><option value="1" ${s.self?"selected":""}>Self servis (müşteri ismi girer)</option><option value="0" ${!s.self?"selected":""}>Masa servisi (QR masaya özel)</option></select></div>
 ${D.items.length?"":`<div class="card"><button class="btn" data-seed>Örnek menüyü yükle</button><p class="muted">İlk kurulumda örnek kategori ve ürünleri ekler.</p></div>`}<div class="card"><h3>Menü yükleme</h3><p class="muted">Family Waffle menüsünü (kategoriler ve ürünler) baştan yükler. Mevcut ürün ve kategoriler silinir. Ayarlar, siparişler ve yönetici listesi etkilenmez. Ürün fotoğrafları silinir.</p><button class="btn bad" data-reseed>Menüyü baştan yükle</button></div>${repCard()}${themeCard()}${campCard()}${tablesCard()}<div class="card"><h3>Kategoriler</h3>${D.cats.map(c=>`<div class="row"><input data-cn="${c.id}" value="${esc(c.name)}"><button class="btn bad" data-dc="${c.id}">Sil</button></div>`).join("")}<button class="btn alt" data-ac>+ Kategori ekle</button></div>
 <h3 style="margin-top:20px">Ürünler</h3>`;
 D.items.forEach(i=>{h+=`<div class="card"><div class="ed">${img(i)}<div><input data-in="${i.id}" value="${esc(i.n)}" aria-label="Ürün adı"><div style="display:flex;gap:8px;margin-top:8px"><input type="number" min="0" data-ip="${i.id}" value="${i.p}" aria-label="Fiyat"><select data-ic="${i.id}">${D.cats.map(c=>`<option value="${c.id}" ${c.id==i.c?"selected":""}>${esc(c.name)}</option>`).join("")}</select></div>
 <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><label class="btn alt" style="margin:0">Fotoğraf<input type="file" accept="image/*" data-if="${i.id}" hidden></label><button class="btn alt" data-so="${i.id}">${i.sold?"Satışa aç":"Tükendi yap"}</button><button class="btn bad" data-di="${i.id}">Sil</button><button class="btn alt" data-xo="${i.id}">Seçenekler${(i.opts||[]).length?` (${i.opts.length})`:""}</button></div></div></div>${D.xo?.[i.id]?optEd(i):""}</div>`});
 h+=`<button class="btn" data-ai>+ Ürün ekle</button></div>`;return h}
function login(t){const u=D.me;return `<div class="wrap" style="text-align:center;padding-top:70px"><h2 style="font-size:36px">${t} girişi</h2><p class="muted">Yalnızca işletmenin yetkili Google hesapları girebilir.</p>${u?`<p style="color:var(--bad)">${esc(u.email)} hesabının bu sayfaya yetkisi yok.</p><button class="btn alt" data-out>Çıkış yap</button>`:`<button class="btn" data-login>Google ile giriş yap</button>`}</div>`}

function draw(){applyTheme();applyBg();navr();const r=route();$("#app").innerHTML=(r=="kasa"?kasa():r=="yonetim"?yon():menu())+(sheet=="cart"?cartSheet():"")+(sheet=="opt"?optSheet():"");window.scrollTo&&0}
document.addEventListener("click",async e=>{const t=e.target.closest("[data-a],[data-m],[data-tab],[data-go],[data-x],[data-send],[data-oi],[data-oc],[data-oadd],[data-xg],[data-xd],[data-xa],[data-xr],[data-xo],[data-snd],[data-test],[data-rcp],[data-act],[data-cancel],[data-edit],[data-clear],[data-at],[data-dt],[data-print],[data-rep],[data-login],[data-out],[data-so],[data-di],[data-ai],[data-ac],[data-dc],[data-close],[data-pal],[data-seed],[data-reseed],[data-mk]");if(!t)return;
 const d=t.dataset;if(d.close!==undefined&&e.target!==t)return;
 try{
 if(d.a){const c=cart[d.a];if(c)c.q++;else cart[d.a]={id:d.a,q:1,o:[]}}
 else if(d.m){const c=cart[d.m];if(c){c.q--;if(c.q<=0)delete cart[d.m]}}
 else if(d.tab){tab=d.tab;draw();document.getElementById("cat-"+tab)?.scrollIntoView({behavior:"smooth"});return}
 else if(d.go)sheet="cart";
 else if(d.x!==undefined||d.close!==undefined){nm=$("#nm")?.value||nm;note=$("#nt")?.value||note;sheet=null}
 else if(d.send!==undefined){await send();return}
 else if(d.oi){osel={id:d.oi,s:{}};sheet="opt"}
 else if(d.oc){const [gi,ci]=d.oc.split("|").map(Number),i=D.items.find(x=>x.id==osel.id),g=og(i)[gi],cur=osel.s[gi]||[];osel.s[gi]=g.multi?(cur.includes(ci)?cur.filter(x=>x!=ci):[...cur,ci]):(cur.includes(ci)?[]:[ci])}
 else if(d.oadd!==undefined){const i=D.items.find(x=>x.id==osel.id),gs=og(i);for(let gi=0;gi<gs.length;gi++)if(gs[gi].req&&!(osel.s[gi]||[]).length){$("#err").textContent=`Lütfen "${gs[gi].name}" seçin.`;return}
  const o=[];gs.forEach((g,gi)=>(osel.s[gi]||[]).sort((a,b)=>a-b).forEach(ci=>o.push({g:g.name,n:g.choices[ci].n})));const k=ckey(i.id,o);if(cart[k])cart[k].q++;else cart[k]={id:i.id,q:1,o};sheet=null;osel=null}
 else if(d.xo){D.xo={...D.xo,[d.xo]:!D.xo?.[d.xo]}}
 else if(d.xg)await sv(d.xg,o=>o.push({name:"",multi:false,req:false,choices:[{n:"",p:0}]}));
 else if(d.xd){const [id,g]=d.xd.split("|");await sv(id,o=>o.splice(+g,1))}
 else if(d.xa){const [id,g]=d.xa.split("|");await sv(id,o=>o[+g].choices.push({n:"",p:0}))}
 else if(d.xr){const [id,g,c]=d.xr.split("|");await sv(id,o=>o[+g].choices.splice(+c,1))}
 else if(d.snd!==undefined){try{localStorage.setItem("snd",sndOn()?"0":"1")}catch(e){}}
 else if(d.test!==undefined)beep(true);
 else if(d.rcp){printReceipt(D.orders.find(x=>x.id==d.rcp));return}
 else if(d.act){const [id,st]=d.act.split("|"),o=D.orders.find(x=>x.id==id);if(st=="cancelled"&&!confirm("Sipariş iptal edilsin mi?"))return;const u={st};if(st=="done"){u.doneAt=serverTimestamp();u.total=ototal(o)}await updateDoc(doc(db,"orders",id),u)}
 else if(d.cancel!==undefined){try{await updateDoc(doc(db,"orders",my),{st:"cancelled"})}catch(e){alert("İptal süresi dolmuş olabilir. Lütfen kasaya haber verin.")}}
 else if(d.edit!==undefined){const o=D.orders.find(x=>x.id==my);try{await updateDoc(doc(db,"orders",my),{st:"cancelled"})}catch(e){alert("Değiştirme süresi dolmuş olabilir. Lütfen kasaya haber verin.");draw();return}
  cart={};(o.lines||[]).forEach(l=>{if(D.items.some(i=>i.id==l.id&&!i.sold)){const o2=Array.isArray(l.o)?l.o.filter(x=>x&&x.g&&x.n):[];cart[ckey(l.id,o2)]={id:l.id,q:Math.min(99,Math.max(1,Math.floor(+l.q)||1)),o:o2}}});note=o.note||"";nm=o.name||"";clearMine();sheet="cart"}
 else if(d.clear!==undefined)clearMine();
 else if(d.at!==undefined)await addTable();
 else if(d.dt){if(confirm("Masa "+d.dt+" silinsin mi? Bu masanın QR kodu çalışmaz olur."))await deleteDoc(doc(db,"tables",d.dt))}
 else if(d.print!==undefined){printQRs();return}
 else if(d.rep!==undefined){await loadRep();return}
 else if(d.login!==undefined)await signInWithPopup(auth,new GoogleAuthProvider());
 else if(d.out!==undefined)await signOut(auth);
 else if(d.so){const i=D.items.find(x=>x.id==d.so);await updateDoc(doc(db,"items",i.id),{sold:!i.sold})}
 else if(d.di){if(confirm("Bu ürün silinsin mi?"))await deleteDoc(doc(db,"items",d.di))}
 else if(d.ai!==undefined)await addDoc(collection(db,"items"),{c:D.cats[0]?.id||"",n:"Yeni ürün",p:0,e:"🍽️",sold:false,order:-Date.now()});
 else if(d.ac!==undefined)await addDoc(collection(db,"categories"),{name:"Yeni kategori",order:Date.now()});
 else if(d.dc){if(D.items.some(i=>i.c==d.dc))alert("Önce bu kategorideki ürünleri taşıyın veya silin.");else await deleteDoc(doc(db,"categories",d.dc))}
 else if(d.pal){const p=PAL[+d.pal];await setDoc(doc(db,"settings","main"),{theme:"normal",c1:p.ac,c2:p.bg},{merge:true})}
 else if(d.reseed!==undefined){if(!confirm("Mevcut tüm ürün ve kategoriler silinip Family Waffle menüsü yüklenecek. Emin misiniz?"))return;await reseedMenu()}
 else if(d.seed!==undefined)await seedDb();
 else if(d.mk!==undefined)await makeTables();
 }catch(err){alert("İşlem yapılamadı: "+(err.code||err.message))}
 draw()});
document.addEventListener("change",async e=>{const t=e.target,d=t.dataset,S=o=>setDoc(doc(db,"settings","main"),o,{merge:true});
 try{
 if(d.s)await S({[d.s]:["self","showDesc","showWifi"].includes(d.s)?t.value=="1":t.value});
 else if(d.cp)await S({camp:{...D.s.camp,[d.cp]:d.cp=="on"?t.value=="1":d.cp=="pct"?Math.min(90,Math.max(0,+t.value||0)):t.value}});
 else if(d.xn){const [id,g]=d.xn.split("|");await sv(id,o=>o[+g].name=t.value.slice(0,40))}
 else if(d.xt){const [id,g]=d.xt.split("|");await sv(id,o=>o[+g].multi=t.value=="1")}
 else if(d.xq){const [id,g]=d.xq.split("|");await sv(id,o=>o[+g].req=t.value=="1")}
 else if(d.xcn){const [id,g,c]=d.xcn.split("|");await sv(id,o=>o[+g].choices[+c].n=t.value.slice(0,40))}
 else if(d.xcp){const [id,g,c]=d.xcp.split("|");await sv(id,o=>o[+g].choices[+c].p=Math.max(0,+t.value||0))}
 else if(d.rd!==undefined)await loadRep();
 else if(d.cn)await updateDoc(doc(db,"categories",d.cn),{name:t.value.slice(0,40)});
 else if(d.in)await updateDoc(doc(db,"items",d.in),{n:t.value.slice(0,60)});
 else if(d.ip)await updateDoc(doc(db,"items",d.ip),{p:Math.max(0,+t.value||0)});
 else if(d.ic)await updateDoc(doc(db,"items",d.ic),{c:t.value});
 else if(d.if&&t.files[0])await updateDoc(doc(db,"items",d.if),{img:await shrink(t.files[0])});
 }catch(err){alert("Kaydedilemedi: "+(err.code||err.message))}});
window.addEventListener("hashchange",()=>{sheet=null;draw()});
draw();
